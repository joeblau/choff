# Final-source validation only: these two job definitions are copied unchanged.
name: CI

on:
  workflow_dispatch:
    inputs:
      perf:
        description: Also run the performance suite
        type: boolean
        default: false
      record_baselines:
        description: Record new performance baselines instead of checking them (artifacts to commit)
        type: boolean
        default: false
      asr_eval:
        description: Also run the ASR evaluation (downloads the models)
        type: boolean
        default: false
      memory_eval:
        description: Also run the memory retrieval and answer evaluation
        type: boolean
        default: false
      soak:
        description: Also run the long-session soak test on the simulator
        type: boolean
        default: false
      soak_minutes:
        description: Soak length in minutes of audio (played at 10x)
        type: string
        default: "20"

permissions:
  contents: read

env:
  XCODE_VERSION: ${{ vars.BLAU_CI_XCODE_VERSION }}
  SIMULATOR_NAME: ${{ vars.BLAU_CI_SIMULATOR || 'iPhone 17' }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  # Stream xcodebuild output instead of buffering it.
  NSUnbufferedIO: "YES"

defaults:
  run:
    shell: bash

jobs:
  perf:
    name: perf
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.perf) }}
    runs-on: ${{ vars.BLAU_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        run: scripts/ci/select-xcode.sh

      - name: Install XcodeGen
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version

      - name: Generate project
        run: make generate

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/BlauKit/Package.swift', 'Packages/BlauKit/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      - name: Pick simulator
        id: simulator
        run: scripts/ci/simulator-destination.sh

      # Writes .build/results/perf.xcresult (the Makefile's PERF_RESULT).
      - name: Build performance test bundles
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: make build-perf-tests

      - name: Warm up performance simulator
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: scripts/ci/warm-simulator.sh "$UDID" .build/DerivedData/Build/Products/Release-iphonesimulator/Blau.app

      # One retry: the runner's simulator sometimes crashes the test runner
      # before any test starts ("never finished bootstrapping"), which would
      # fail the night with nothing measured. A real failure fails twice.
      - name: Performance tests
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          XCODEBUILD_FLAGS: "-parallel-testing-enabled NO -collect-test-diagnostics never"
        run: |
          if ! make perf; then
            echo "::warning::The performance tests failed; retrying once."
            make perf
          fi

      - name: Shut down simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl shutdown "$UDID" || true

      - name: Regression gate
        if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.record_baselines) }}
        run: make perf-check

      - name: Record baseline
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.record_baselines }}
        # The extracted results too, so several runs can be pooled into one
        # calibrated baseline (docs/performance.md, "Updating baselines").
        run: |
          make perf-baseline
          cp BlauPerfTests/Baselines/ci-simulator.json .build/results/
          scripts/perf/perf-gate.py extract --xcresult .build/results/perf.xcresult \
            --output .build/results/perf-results.json

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .build/results/perf-report.md ]; then
            cat .build/results/perf-report.md >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-results-${{ github.run_attempt }}
          path: |
            .build/results/perf.xcresult
            .build/results/perf-report.md
            .build/results/perf-results.json
            .build/results/ci-simulator.json
          if-no-files-found: warn
          retention-days: 90

  # Nightly (and on demand) long-session soak test (#76) at reduced length:
  # 20 minutes of mixed audio (the user, a TV, silence) at 10x through the
  # app's pipeline on the simulator, against a local fake realtime server.
  # Fails on memory growth, latency drift, dropped frames, a missed session
  # renewal, a stalled conversation or a topic count out of range, and on
  # leaked memory growing between the app's leak readings. The report goes on
  # the run's summary page and is kept 90 days. The full two hours run weekly
  # on a device (docs/soak.md).
  soak:
    name: soak
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.soak) }}
    runs-on: ${{ vars.BLAU_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 75
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        run: scripts/ci/select-xcode.sh

      - name: Install XcodeGen
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version

      - name: Generate project
        run: make generate

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/BlauKit/Package.swift', 'Packages/BlauKit/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      - name: Pick simulator
        id: simulator
        run: scripts/ci/simulator-destination.sh

      # Writes .build/results/soak (the Makefile's SOAK_OUTPUT).
      - name: Build soak test bundles
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: make build-perf-tests

      - name: Warm up soak simulator
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: scripts/ci/warm-simulator.sh "$UDID" .build/DerivedData/Build/Products/Release-iphonesimulator/Blau.app

      # Quantitative acceptance is measured without an external heap scanner.
      # All eight checks and the original limits remain required.
      - name: Quantitative soak
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          SOAK_MINUTES: ${{ inputs.soak_minutes || vars.BLAU_CI_SOAK_MINUTES || '20' }}
          SOAK_LEAKS: '0'
          XCODEBUILD_FLAGS: "-parallel-testing-enabled NO -collect-test-diagnostics never"
        run: |
          make soak SOAK_MINUTES="$SOAK_MINUTES"
          xcrun xcresulttool get test-results summary --path .build/results/soak/soak.xcresult --compact >.build/results/soak/test-summary.json
          python3 -I scripts/soak/check-profiled-run.py .build/results/soak --quantitative --minutes "$SOAK_MINUTES" --status 0

      - name: Leak profiling
        if: ${{ !cancelled() && (vars.BLAU_CI_SOAK_LEAKS || '1') != '0' }}
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          SOAK_MINUTES: ${{ inputs.soak_minutes || vars.BLAU_CI_SOAK_MINUTES || '20' }}
          SOAK_LEAKS: '1'
          XCODEBUILD_FLAGS: "-parallel-testing-enabled NO -collect-test-diagnostics never"
        run: |
          status=0
          make soak SOAK_MINUTES="$SOAK_MINUTES" SOAK_OUTPUT=.build/results/soak-leaks || status=$?
          xcrun xcresulttool get test-results summary --path .build/results/soak-leaks/soak.xcresult --compact >.build/results/soak-leaks/test-summary.json
          python3 -I scripts/soak/check-profiled-run.py .build/results/soak-leaks --minutes "$SOAK_MINUTES" --status "$status"

      - name: Shut down simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl shutdown "$UDID" || true

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .build/results/soak/summary.md ]; then
            echo '## Quantitative acceptance (unprofiled; all eight checks required)' >>"$GITHUB_STEP_SUMMARY"
            cat .build/results/soak/summary.md >>"$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .build/results/soak-leaks/summary.md ]; then
            echo '## Leak profiling (correctness and zero leak growth required; timing and footprint diagnostic)' >>"$GITHUB_STEP_SUMMARY"
            cat .build/results/soak-leaks/summary.md >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-results-${{ github.run_attempt }}
          path: |
            .build/results/soak/
            .build/results/soak-leaks/
          if-no-files-found: warn
          retention-days: 90

  # Nightly (and on demand) ASR evaluation (#32): WER, first-partial and
  # end-of-utterance latency and RTF of every engine on the ASR fixtures with
  # the real models, failing on the regression gate in
  # docs/asr-eval/thresholds.json. The report is kept as an artifact (the
  # history) and shown on the run's summary page. The pinned models (~700 MB,
  # public on Hugging Face, no token) are cached by manifest. See
  # docs/asr-eval.md.

# Diagnostic only: profiling adds overhead and is not acceptance.
  cold-expansion-profile:
    name: cold-expansion-profile
    runs-on: ${{ vars.BLAU_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    env:
      UI_TEST_SUITE: performance
      UI_SHARD: 1/1
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        id: xcode
        run: scripts/ci/select-xcode.sh

      - name: Install XcodeGen
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen --version

      - name: Generate project
        run: make generate

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/BlauKit/Package.swift', 'Packages/BlauKit/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-

      - name: Pick simulator
        id: simulator
        run: scripts/ci/simulator-destination.sh

      # Build first, then boot the simulator and launch the app once. On a
      # cold simulator the app's first launch outlasted XCUITest's launch
      # timeout and failed each shard's first test; in one job the unit tests
      # used to warm it up. Booting only after the build keeps the boot from
      # starving the build.
      - name: Build
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          XCODEBUILD_FLAGS: "SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule -enableCodeCoverage NO"
        run: make build-tests

      - name: Build profiler symbols
        run: |
          mkdir -p .build/results/expansion-profile
          xcrun dsymutil .build/DerivedData/Build/Products/Debug-iphonesimulator/Blau.app/Blau -o .build/results/expansion-profile/Blau.dSYM

      # Three to eight minutes on the runner.
      - name: Warm up simulator
        timeout-minutes: 15
        continue-on-error: true
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: scripts/ci/warm-simulator.sh "$UDID" .build/DerivedData/Build/Products/Debug-iphonesimulator/Blau.app

      - name: Test
        id: test
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          XCODEBUILD_FLAGS: "-resultBundlePath .build/results/app-ui-performance.xcresult -parallel-testing-enabled NO -collect-test-diagnostics never SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule -enableCodeCoverage NO"
        run: |
          python3 - <<'PY_PROFILE'
          import json, os, signal, subprocess, time
          from pathlib import Path
          root=Path('.build/results/expansion-profile')
          root.mkdir(parents=True,exist_ok=True)
          udid=os.environ['UDID']
          def app_pids():
              result=[]
              for row in subprocess.check_output(['ps','-axo','pid,comm'],text=True).splitlines():
                  if f'/Devices/{udid}/' in row and row.rstrip().endswith('/Blau.app/Blau'):
                      result.append(int(row.split(None,1)[0]))
              return set(result)
          before=app_pids()
          options=json.loads(subprocess.check_output(['xcrun','xctrace','record','--template','Time Profiler','--instrument','os_signpost','--show-recording-options'],text=True))
          options['Time Profiler']['highFrequencySampling']=True
          options['Time Profiler']['recordWaitingThreads']=False
          options['os_signpost']['dynamicTracingEnabledSubsystems']=['com.joeblau.blau']
          settings=root/'recording-options.json'; settings.write_text(json.dumps(options,indent=2)+'\n')
          runner=subprocess.Popen(['make','test-ui',f'UI_SHARD={os.environ["UI_SHARD"]}'])
          trace=None; trace_log=None; target=None; trace_status=None
          try:
              deadline=time.monotonic()+180
              while runner.poll() is None and time.monotonic()<deadline:
                  found=app_pids()-before
                  if len(found)==1:
                      target=found.pop(); break
                  time.sleep(.1)
              if target is not None:
                  print(f'Attaching profiler to simulator {udid}, app PID {target}',flush=True)
                  trace_log=(root/'recording.log').open('w')
                  trace=subprocess.Popen(['xcrun','xctrace','record','--no-prompt','--template','Time Profiler','--instrument','os_signpost','--recording-options',str(settings),'--device',udid,'--attach',str(target),'--time-limit','180s','--output',str(root/'expansion.trace')],stdout=trace_log,stderr=subprocess.STDOUT)
              test_status=runner.wait(timeout=600)
              if trace is not None:
                  trace_status=trace.wait(timeout=240)
              else:
                  print('No fresh simulator app process was found; trace is missing',flush=True)
              (root/'statuses.json').write_text(json.dumps({'test_exit':test_status,'trace_exit':trace_status,'pid':target,'source':'03954c4322af6f6dcdef05a29763ec27619758ae','profiling_only':True},indent=2)+'\n')
          finally:
              if runner.poll() is None:
                  runner.terminate(); runner.wait(timeout=30)
              if trace is not None and trace.poll() is None:
                  trace.send_signal(signal.SIGINT)
                  try: trace.wait(timeout=30)
                  except subprocess.TimeoutExpired: trace.kill(); trace.wait()
              if trace_log is not None: trace_log.close()
          raise SystemExit(test_status if test_status else (trace_status if trace_status is not None else 1))
          PY_PROFILE

      # A selection that matched no test would otherwise pass with nothing
      # run. Also after failing tests, which count, so every run shows the
      # shard ran its whole slice.
      - name: Check the performance suite ran its test
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: scripts/ci/ui-test-shard.sh --check "$UI_SHARD" .build/results/app-ui-performance.xcresult

      - name: Export expansion profile
        if: ${{ !cancelled() }}
        run: |
          root=.build/results/expansion-profile
          if [ -f "$root/expansion.trace/form.template" ]; then
            xcrun xctrace symbolicate --input "$root/expansion.trace" --dsym "$root/Blau.dSYM" > "$root/symbolication.log" 2>&1 || true
            xcrun xctrace export --input "$root/expansion.trace" --toc --output "$root/toc.xml"
            xcrun xctrace export --input "$root/expansion.trace" --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' --output "$root/cpu.xml"
            xcrun xctrace export --input "$root/expansion.trace" --xpath '/trace-toc/run[@number="1"]/data/table[@schema="os-signpost" and @dynamic-tracing-enabled-subsystems]' --output "$root/signposts.xml"
          fi

      - name: Upload expansion profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cold-expansion-profile-${{ github.run_attempt }}
          path: .build/results/expansion-profile
          if-no-files-found: warn
          retention-days: 90

      - name: Shut down simulator
        if: ${{ always() && steps.simulator.outputs.udid != '' }}
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl shutdown "$UDID" || true

      - name: Upload xcresult
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-ui-performance-xcresult-${{ github.run_attempt }}
          path: .build/results/app-ui-performance.xcresult
          if-no-files-found: warn
          retention-days: 14
