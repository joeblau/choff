# Diagnostic-only controls/layout isolation. Temporary variants must not be merged.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  XCODE_VERSION: ${{ vars.BLAU_CI_XCODE_VERSION }}
  SIMULATOR_NAME: ${{ vars.BLAU_CI_SIMULATOR || 'iPhone 17' }}
  HOMEBREW_NO_AUTO_UPDATE: "1"
  NSUnbufferedIO: "YES"
defaults:
  run:
    shell: bash
jobs:
  topic-expansion-diagnostic:
    runs-on: ${{ vars.BLAU_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [share, more, layout]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Xcode
        id: xcode
        run: scripts/ci/select-xcode.sh
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Prepare diagnostic variant
        env:
          DIAGNOSTIC_VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          p = Path("Blau/Timeline/TopicDetail.swift")
          s = p.read_text()
          variant = os.environ["DIAGNOSTIC_VARIANT"]
          if variant == "share":
              old = "TopicShareAction(topic: topic, container: container)"
              new = 'Text("Share").frame(minHeight: 44)'
          elif variant == "more":
              old = "TopicMoreAction(\n                    topicID: topic.id, title: topic.title, canMerge: placement.canMerge, editor: editor)"
              new = 'Text("More").frame(minHeight: 44)'
          else:
              old = "TopicActionsLayout {"
              new = "HStack(spacing: 8) {"
          assert s.count(old) == 1, (variant, s.count(old))
          p.write_text(s.replace(old, new, 1))
          PYTHON
      - name: Generate project
        run: make generate
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Packages/BlauKit/Package.swift', 'Packages/BlauKit/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-
      - name: Pick simulator
        id: simulator
        run: scripts/ci/simulator-destination.sh
      - name: Build
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          XCODEBUILD_FLAGS: "SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule -enableCodeCoverage NO"
        run: make build-tests
      - name: Warm up simulator
        timeout-minutes: 15
        continue-on-error: true
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: scripts/ci/warm-simulator.sh "$UDID" .build/DerivedData/Build/Products/Debug-iphonesimulator/Blau.app
      - name: Three cold launches
        timeout-minutes: 12
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          mkdir -p .build/results
          xcodebuild test-without-building -project Blau.xcodeproj -scheme Blau -testPlan Blau -destination "$DESTINATION" -derivedDataPath .build/DerivedData -resultBundlePath .build/results/cold-expansion.xcresult -only-testing:BlauUITests/TopicDetailUITests/testTappingExpandsWithinAHundredMilliseconds -test-iterations 3 -parallel-testing-enabled NO -collect-test-diagnostics never SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule -enableCodeCoverage NO CODE_SIGNING_ALLOWED=NO XAI_DEV_API_KEY= 2>&1 | tee .build/results/cold-expansion.log
          count=$(grep -c "testTappingExpandsWithinAHundredMilliseconds]' passed" .build/results/cold-expansion.log)
          test "$count" -eq 3
          xcrun xcresulttool export attachments --path .build/results/cold-expansion.xcresult --output-path .build/results/attachments
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: topic-expansion-${{ matrix.variant }}
          path: .build/results/
          retention-days: 7
